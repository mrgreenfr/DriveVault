name: Background recording test APK

on:
  push:
    branches: [fix/background-recording]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-recording-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_NAME: 1.0.0-background-fix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Configure local test build without cloud credentials
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          # The Google Services plugin needs this file at build time. Runtime
          # Firebase BuildConfig values stay empty, so no cloud project is used.
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "drivevault-local-test",
                  "storage_bucket": "drivevault-local-test.invalid",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                      "android_client_info": {
                          "package_name": "com.drivevault.dashcam.debug"
                      },
                  },
                  "api_key": [{"current_key": "local-test-placeholder"}],
              }],
              "configuration_version": "1",
          }
          Path("app/google-services.json").write_text(json.dumps(config), encoding="utf-8")
          PY

      - name: Build APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Verify APK signature and package
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$build_tools/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n '1p'

      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DriveVault-background-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
